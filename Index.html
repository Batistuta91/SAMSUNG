<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>איתור אריזות במשטחים</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="איתור אריזות במשטחים">

<style>
:root{--bg:#12151a;--panel:#1b1f27;--panel-2:#232833;--line:#2c313c;--text:#eef0f3;--muted:#8a92a3;--amber:#f5a623;--cyan:#35c9c1;--radius:14px;--mono:'SFMono-Regular',Consolas,'Courier New',monospace;--header-bg:rgba(18,21,26,0.92);}
body.theme-light{--bg:#f4f5f7;--panel:#ffffff;--panel-2:#eef0f3;--line:#d7dbe2;--text:#181b20;--muted:#5c6473;--amber:#b3690f;--cyan:#0c766f;--header-bg:rgba(244,245,247,0.92);}
body.contrast-high{--bg:#000000;--panel:#000000;--panel-2:#111111;--line:#ffffff;--text:#ffffff;--muted:#ffffff;--amber:#ffd400;--cyan:#00eaff;--header-bg:rgba(0,0,0,0.97);}
body.contrast-high *{border-color:var(--line) !important;}
body.fs-2{zoom:1.15;}
body.fs-3{zoom:1.3;}
body.fs-4{zoom:1.45;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%;}
body{background-image:linear-gradient(180deg,rgba(245,166,35,0.06),transparent 220px);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
input{font-size:16px;}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px calc(90px + env(safe-area-inset-bottom));}
header.top{position:sticky;top:0;z-index:20;background:var(--header-bg);backdrop-filter:blur(8px);padding:calc(12px + env(safe-area-inset-top)) 14px 10px;margin:calc(-1 * env(safe-area-inset-top)) -14px 6px;border-bottom:1px solid var(--line);}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.brand .tag{width:34px;height:34px;border-radius:8px;background:repeating-linear-gradient(45deg,var(--amber),var(--amber) 4px,#a5720f 4px,#a5720f 8px);flex:none;box-shadow:0 0 0 1px rgba(0,0,0,0.3) inset;}
.brand h1{font-size:17px;margin:0;font-weight:700;}
.brand p{margin:1px 0 0;font-size:12px;color:var(--muted);}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;}
.searchbox:focus-within{border-color:var(--amber);}
.searchbox svg{flex:none;opacity:.6;}
.searchbox input{flex:1;background:transparent;border:0;outline:0;color:var(--text);font-size:16px;font-family:var(--mono);letter-spacing:.3px;}
.searchbox input::placeholder{font-family:-apple-system,sans-serif;color:var(--muted);letter-spacing:0;}
.clear-btn{border:0;background:var(--panel-2);color:var(--muted);border-radius:8px;width:26px;height:26px;font-size:14px;cursor:pointer;display:none;flex:none;}
.tabs{display:flex;gap:8px;margin:12px 0 4px;}
.tab{flex:1;text-align:center;padding:9px 6px;border-radius:10px;font-size:13px;font-weight:600;background:var(--panel);color:var(--muted);border:1px solid var(--line);cursor:pointer;user-select:none;}
.tab.active{background:var(--amber);color:#1a1206;border-color:var(--amber);}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:16px 2px 8px;font-size:13px;color:var(--muted);}
.section-title b{color:var(--text);font-size:14px;}
.pallet-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.pallet-chip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;position:relative;overflow:hidden;}
.pallet-chip::before{content:"";position:absolute;right:0;top:0;bottom:0;width:5px;background:var(--cyan);}
.pallet-chip .pn{font-family:var(--mono);font-size:16px;font-weight:800;color:var(--cyan);}
.pallet-chip .meta{font-size:11.5px;color:var(--muted);margin-top:5px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.card .body{flex:1;min-width:150px;}
.card .cpn-label{font-size:10.5px;color:var(--muted);margin-bottom:2px;letter-spacing:.2px;}
.card .cpn{font-family:var(--mono);font-size:19px;font-weight:800;word-break:break-all;line-height:1.15;}
.card .qty-line{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:6px;}
.card .qty-line b{color:var(--amber);font-weight:700;}
.card .pallet-block{flex:none;text-align:center;cursor:pointer;background:var(--panel-2);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;min-width:118px;}
.card .pallet-block:active{border-color:var(--cyan);}
.card .pallet-block .pallet-label{font-size:9.5px;color:var(--muted);margin-bottom:3px;letter-spacing:.3px;}
.card .pallet-block .pallet-num{font-family:var(--mono);font-weight:800;color:var(--cyan);font-size:19px;letter-spacing:.2px;line-height:1.15;word-break:break-all;}
.empty{text-align:center;padding:40px 10px;color:var(--muted);font-size:14px;}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px;}
.pallet-header{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.pallet-header .pn{font-family:var(--mono);font-weight:800;font-size:23px;color:var(--cyan);letter-spacing:.2px;}
.pallet-header .cnt{font-size:12px;color:var(--muted);margin-top:4px;}
.back-btn{border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;cursor:pointer;flex:none;}
.a11y-fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:16px;z-index:150;width:52px;height:52px;border-radius:50%;background:var(--amber);color:#1a1206;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,0.4);}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;display:none;align-items:flex-end;justify-content:center;}
.modal-backdrop.show{display:flex;}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:640px;padding:20px 18px calc(20px + env(safe-area-inset-bottom));}
.modal h3{margin:0 0 8px;color:var(--text);font-size:15px;}
.a11y-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
.a11y-row:last-of-type{border-bottom:0;}
.a11y-row>span{font-size:14px;font-weight:600;}
.a11y-controls{display:flex;align-items:center;gap:6px;}
.seg-btn{border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;}
.seg-btn.active{background:var(--amber);color:#1a1206;border-color:var(--amber);}
.fs-level{font-size:12.5px;color:var(--muted);min-width:44px;text-align:center;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:11px;padding:12px 16px;font-size:14.5px;font-weight:700;cursor:pointer;width:100%;}
.btn-primary{background:var(--amber);color:#1a1206;}
.btn-secondary{background:var(--panel-2);color:var(--text);border:1px solid var(--line);}
.btn-row{display:flex;gap:8px;margin-top:10px;}
.btn-row .btn{flex:1;}
::-webkit-scrollbar{display:none;}
</style>
</head>

const pallets = {};
DATA.forEach(d=>{ if(!pallets[d.pallet]) pallets[d.pallet]={rows:[],items:0,totalQty:0,cpns:new Set()}; const p=pallets[d.pallet]; p.rows.push(d); p.items++; p.totalQty+=(d.qty||0); p.cpns.add(d.cpn); });
const palletIds = Object.keys(pallets).sort();
function fmtQty(n){ return (n||0).toLocaleString('en-US'); }
const searchInput=document.getElementById('searchInput'),clearBtn=document.getElementById('clearBtn'),resultsList=document.getElementById('resultsList'),resultCount=document.getElementById('resultCount'),searchView=document.getElementById('searchView'),palletsView=document.getElementById('palletsView'),palletGrid=document.getElementById('palletGrid'),palletGridWrap=document.getElementById('palletGridWrap'),palletDetail=document.getElementById('palletDetail'),tabs=document.querySelectorAll('.tab');
document.getElementById('palletCount').textContent = palletIds.length + ' משטחים';
function renderResults(filter){
const q=(filter||'').trim().toUpperCase();
let rows=DATA;
if(q){ rows=DATA.filter(d=> d.cpn.toUpperCase().includes(q) || d.pallet.toUpperCase().includes(q)); }
resultCount.textContent = rows.length + ' ' + (rows.length===1?'רשומה':'רשומות');
if(rows.length===0){ resultsList.innerHTML='<div class="empty"><b>לא נמצאו תוצאות</b>נסה מק״ט אחר או מספר משטח מלא/חלקי</div>'; return; }
resultsList.innerHTML = rows.map(d=>'<div class="card"><div class="body"><div class="cpn-label">מק"ט</div><div class="cpn">'+d.cpn+'</div><div class="qty-line"><b>'+fmtQty(d.qty)+'</b> יח׳</div></div><div class="pallet-block" data-pallet="'+d.pallet+'"><div class="pallet-label">משטח</div><div class="pallet-num">'+d.pallet+'</div></div></div>').join('');
}
function renderPalletGrid(){
palletGrid.innerHTML = palletIds.map(pid=>{ const p=pallets[pid]; return '<div class="pallet-chip" data-pallet="'+pid+'"><div class="pn">'+pid+'</div><div class="meta">'+p.cpns.size+' מק״טים · '+p.items+' רשומות</div></div>'; }).join('');
}
function openPallet(pid){
const p=pallets[pid]; if(!p) return;
palletGridWrap.style.display='none'; palletDetail.style.display='block';
palletDetail.innerHTML = '<div class="pallet-header"><div><div class="pn">'+pid+'</div><div class="cnt">'+p.cpns.size+' מק״טים שונים · '+p.items+' רשומות · סה״כ '+fmtQty(p.totalQty)+' יח׳</div></div><button class="back-btn" id="backToPallets">← כל המשטחים</button></div><div id="palletRows"></div>';
document.getElementById('palletRows').innerHTML = p.rows.slice().sort((a,b)=>a.cpn.localeCompare(b.cpn)).map(d=>'<div class="card"><div class="body"><div class="cpn-label">מק"ט</div><div class="cpn">'+d.cpn+'</div><div class="qty-line"><b>'+fmtQty(d.qty)+'</b> יח׳</div></div></div>').join('');
document.getElementById('backToPallets').addEventListener('click', closePallet);
window.scrollTo({top:0,behavior:'smooth'});
}
function closePallet(){ palletDetail.style.display='none'; palletDetail.innerHTML=''; palletGridWrap.style.display='block'; }
function switchTab(name){ tabs.forEach(t=>t.classList.toggle('active', t.dataset.tab===name)); if(name==='search'){ searchView.style.display='block'; palletsView.style.display='none'; } else { searchView.style.display='none'; palletsView.style.display='block'; closePallet(); } }
tabs.forEach(t=>t.addEventListener('click', ()=>switchTab(t.dataset.tab)));
searchInput.addEventListener('input', ()=>{ clearBtn.style.display = searchInput.value?'block':'none'; renderResults(searchInput.value); });
clearBtn.addEventListener('click', ()=>{ searchInput.value=''; clearBtn.style.display='none'; renderResults(''); searchInput.focus(); });
resultsList.addEventListener('click', e=>{ const tag=e.target.closest('.pallet-block'); if(tag){ switchTab('pallets'); openPallet(tag.dataset.pallet); } });
palletGrid.addEventListener('click', e=>{ const chip=e.target.closest('.pallet-chip'); if(chip) openPallet(chip.dataset.pallet); });
renderResults(''); renderPalletGrid();
const A11Y_KEY='palletFinder.a11y.v1';
function loadA11y(){ try{ return Object.assign({theme:'dark',contrast:false,fs:1}, JSON.parse(localStorage.getItem(A11Y_KEY))); }catch(e){ return {theme:'dark',contrast:false,fs:1}; } }
function saveA11y(s){ localStorage.setItem(A11Y_KEY, JSON.stringify(s)); }
let a11yState = loadA11y();
function applyA11y(){
document.body.classList.toggle('theme-light', a11yState.theme==='light');
document.body.classList.toggle('contrast-high', !!a11yState.contrast);
document.body.classList.remove('fs-1','fs-2','fs-3','fs-4');
document.body.classList.add('fs-'+a11yState.fs);
document.getElementById('themeDark').classList.toggle('active', a11yState.theme==='dark');
document.getElementById('themeLight').classList.toggle('active', a11yState.theme==='light');
document.getElementById('contrastToggle').classList.toggle('active', !!a11yState.contrast);
document.getElementById('contrastToggle').textContent = a11yState.contrast ? 'כבוי' : 'הפעלה';
const labels={1:'רגיל',2:'גדול',3:'גדול מאוד',4:'מקסימלי'};
document.getElementById('fsLevelLabel').textContent = labels[a11yState.fs] || 'רגיל';
}
document.getElementById('a11yFab').addEventListener('click', ()=>document.getElementById('a11yModal').classList.add('show'));
document.getElementById('a11yClose').addEventListener('click', ()=>document.getElementById('a11yModal').classList.remove('show'));
document.getElementById('fsInc').addEventListener('click', ()=>{ a11yState.fs=Math.min(4,a11yState.fs+1); saveA11y(a11yState); applyA11y(); });
document.getElementById('fsDec').addEventListener('click', ()=>{ a11yState.fs=Math.max(1,a11yState.fs-1); saveA11y(a11yState); applyA11y(); });
document.getElementById('contrastToggle').addEventListener('click', ()=>{ a11yState.contrast=!a11yState.contrast; saveA11y(a11yState); applyA11y(); });
document.getElementById('themeDark').addEventListener('click', ()=>{ a11yState.theme='dark'; saveA11y(a11yState); applyA11y(); });
document.getElementById('themeLight').addEventListener('click', ()=>{ a11yState.theme='light'; saveA11y(a11yState); applyA11y(); });
document.getElementById('a11yReset').addEventListener('click', ()=>{ a11yState={theme:'dark',contrast:false,fs:1}; saveA11y(a11yState); applyA11y(); });
applyA11y();
</script>
