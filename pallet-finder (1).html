<style>
  :root{
    --bg: #12151a;
    --panel: #1b1f27;
    --panel-2: #232833;
    --line: #2c313c;
    --text: #eef0f3;
    --muted: #8a92a3;
    --amber: #f5a623;
    --amber-dim: #7a5716;
    --cyan: #35c9c1;
    --danger: #e2584d;
    --radius: 14px;
    --mono: 'SFMono-Regular', Consolas, 'Courier New', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    min-height:100vh; min-height:100dvh;
    -webkit-text-size-adjust:100%; overscroll-behavior-y:none;}
  body{
    background-image:
      linear-gradient(180deg, rgba(245,166,35,0.06), transparent 220px);
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  input, textarea{font-size:16px;} /* prevents iOS auto-zoom on focus */
  .wrap{max-width:640px; margin:0 auto; padding:14px 14px calc(90px + env(safe-area-inset-bottom));}

  header.top{
    position:sticky; top:0; z-index:20; background:rgba(18,21,26,0.92);
    backdrop-filter: blur(8px); padding:calc(12px + env(safe-area-inset-top)) 14px 10px; margin:calc(-1 * env(safe-area-inset-top)) -14px 6px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .brand .tag{
    width:34px; height:34px; border-radius:8px;
    background:repeating-linear-gradient(45deg, var(--amber), var(--amber) 4px, #a5720f 4px, #a5720f 8px);
    flex:none; position:relative; box-shadow:0 0 0 1px rgba(0,0,0,0.3) inset;
  }
  .brand h1{font-size:17px; margin:0; font-weight:700; letter-spacing:.2px;}
  .brand p{margin:1px 0 0; font-size:12px; color:var(--muted);}

  .searchbox{
    display:flex; align-items:center; gap:8px;
    background:var(--panel); border:1.5px solid var(--line); border-radius:12px;
    padding:10px 12px;
  }
  .searchbox:focus-within{border-color:var(--amber);}
  .searchbox svg{flex:none; opacity:.6;}
  .searchbox input{
    flex:1; background:transparent; border:0; outline:0; color:var(--text);
    font-size:16px; font-family:var(--mono); letter-spacing:.3px;
  }
  .searchbox input::placeholder{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif; color:var(--muted); letter-spacing:0;}
  .clear-btn{
    border:0; background:var(--panel-2); color:var(--muted); border-radius:8px;
    width:26px; height:26px; font-size:14px; cursor:pointer; display:none; flex:none;
  }

  .tabs{display:flex; gap:8px; margin:12px 0 4px;}
  .tab{
    flex:1; text-align:center; padding:9px 6px; border-radius:10px; font-size:13px;
    font-weight:600; background:var(--panel); color:var(--muted); border:1px solid var(--line);
    cursor:pointer; user-select:none;
  }
  .tab.active{background:var(--amber); color:#1a1206; border-color:var(--amber);}

  .section-title{
    display:flex; align-items:baseline; justify-content:space-between;
    margin:16px 2px 8px; font-size:13px; color:var(--muted);
  }
  .section-title b{color:var(--text); font-size:14px;}

  /* Pallet chip grid */
  .pallet-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .pallet-chip{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; cursor:pointer; position:relative; overflow:hidden;
  }
  .pallet-chip::before{
    content:""; position:absolute; right:0; top:0; bottom:0; width:5px;
    background:var(--cyan);
  }
  .pallet-chip .pn{font-family:var(--mono); font-size:12.5px; color:var(--text); font-weight:700; letter-spacing:.3px;}
  .pallet-chip .meta{font-size:11.5px; color:var(--muted); margin-top:4px;}
  .pallet-chip.active{border-color:var(--cyan); background:#17262a;}

  /* Result cards */
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:9px; display:flex; align-items:center; gap:12px;
  }
  .card .cap{
    flex:none; width:46px; height:46px; border-radius:10px; background:var(--panel-2);
    display:flex; align-items:center; justify-content:center; font-size:10.5px;
    color:var(--amber); font-weight:700; font-family:var(--mono); border:1px solid var(--line);
    text-align:center; line-height:1.15;
  }
  .card .body{flex:1; min-width:0;}
  .card .cpn{font-family:var(--mono); font-size:14.5px; font-weight:700; color:var(--text); word-break:break-all;}
  .card .row2{display:flex; flex-wrap:wrap; gap:6px 10px; margin-top:5px; font-size:12px; color:var(--muted);}
  .card .row2 .pallet-tag{
    font-family:var(--mono); background:var(--panel-2); border:1px solid var(--line);
    border-radius:6px; padding:1px 7px; color:var(--cyan); cursor:pointer;
  }
  .card .qty{
    flex:none; text-align:left; font-family:var(--mono); font-weight:700; color:var(--amber);
    font-size:14px; white-space:nowrap;
  }
  .card .qty span{display:block; font-size:9.5px; color:var(--muted); font-weight:400; font-family:-apple-system,sans-serif;}

  .empty{
    text-align:center; padding:40px 10px; color:var(--muted); font-size:14px;
  }
  .empty b{display:block; color:var(--text); font-size:15px; margin-bottom:4px;}

  .pallet-header{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between;
  }
  .pallet-header .pn{font-family:var(--mono); font-weight:700; font-size:15px;}
  .pallet-header .cnt{font-size:12px; color:var(--muted); margin-top:2px;}
  .back-btn{
    border:1px solid var(--line); background:var(--panel-2); color:var(--text);
    border-radius:9px; padding:8px 12px; font-size:13px; cursor:pointer; flex:none;
  }

  ::-webkit-scrollbar{display:none;}
</style>
</head>

// aggregate helpers
const pallets = {};
DATA.forEach(d=>{
  if(!pallets[d.pallet]) pallets[d.pallet] = {rows:[], items:0, totalQty:0, cpns:new Set()};
  const p = pallets[d.pallet];
  p.rows.push(d);
  p.items++;
  p.totalQty += (d.qty||0);
  p.cpns.add(d.cpn);
});
const palletIds = Object.keys(pallets).sort();

document.querySelector('#palletGrid').parentElement.querySelector('b').textContent = palletIds.length + ' משטחים';

const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
const resultsList = document.getElementById('resultsList');
const resultCount = document.getElementById('resultCount');
const searchView = document.getElementById('searchView');
const palletsView = document.getElementById('palletsView');
const palletGrid = document.getElementById('palletGrid');
const palletGridWrap = document.getElementById('palletGridWrap');
const palletDetail = document.getElementById('palletDetail');
const tabs = document.querySelectorAll('.tab');

function fmtQty(n){ return n.toLocaleString('en-US'); }

function renderResults(filter){
  const q = (filter||'').trim().toUpperCase();
  let rows = DATA;
  if(q){
    rows = DATA.filter(d =>
      d.cpn.toUpperCase().includes(q) ||
      d.pallet.toUpperCase().includes(q) ||
      (d.capa && d.capa.toUpperCase().includes(q))
    );
  }
  resultCount.textContent = rows.length + ' ' + (rows.length===1 ? 'רשומה' : 'רשומות');
  if(rows.length === 0){
    resultsList.innerHTML = `<div class="empty"><b>לא נמצאו תוצאות</b>נסה מק״ט אחר או מספר משטח מלא/חלקי</div>`;
    return;
  }
  resultsList.innerHTML = rows.map(d => `
    <div class="card">
      <div class="cap">${d.capa || '—'}</div>
      <div class="body">
        <div class="cpn">${d.cpn}</div>
        <div class="row2">
          <span class="pallet-tag" data-pallet="${d.pallet}">${d.pallet}</span>
        </div>
      </div>
      <div class="qty">${fmtQty(d.qty)}<span>יח׳</span></div>
    </div>
  `).join('');
}

function renderPalletGrid(){
  palletGrid.innerHTML = palletIds.map(pid => {
    const p = pallets[pid];
    return `
    <div class="pallet-chip" data-pallet="${pid}">
      <div class="pn">${pid}</div>
      <div class="meta">${p.cpns.size} מק״טים · ${p.items} רשומות</div>
    </div>`;
  }).join('');
}

function openPallet(pid){
  const p = pallets[pid];
  if(!p) return;
  palletGridWrap.style.display = 'none';
  palletDetail.style.display = 'block';
  palletDetail.innerHTML = `
    <div class="pallet-header">
      <div>
        <div class="pn">${pid}</div>
        <div class="cnt">${p.cpns.size} מק״טים שונים · ${p.items} רשומות · סה״כ ${fmtQty(p.totalQty)} יח׳</div>
      </div>
      <button class="back-btn" id="backToPallets">← כל המשטחים</button>
    </div>
    <div id="palletRows"></div>
  `;
  const rowsHtml = p.rows
    .slice()
    .sort((a,b)=> a.cpn.localeCompare(b.cpn))
    .map(d => `
      <div class="card">
        <div class="cap">${d.capa || '—'}</div>
        <div class="body">
          <div class="cpn">${d.cpn}</div>
        </div>
        <div class="qty">${fmtQty(d.qty)}<span>יח׳</span></div>
      </div>
    `).join('');
  document.getElementById('palletRows').innerHTML = rowsHtml;
  document.getElementById('backToPallets').addEventListener('click', closePallet);
  window.scrollTo({top:0, behavior:'smooth'});
}

function closePallet(){
  palletDetail.style.display = 'none';
  palletDetail.innerHTML = '';
  palletGridWrap.style.display = 'block';
}

function switchTab(name){
  tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  if(name === 'search'){
    searchView.style.display = 'block';
    palletsView.style.display = 'none';
  } else {
    searchView.style.display = 'none';
    palletsView.style.display = 'block';
    closePallet();
  }
}

tabs.forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

searchInput.addEventListener('input', () => {
  clearBtn.style.display = searchInput.value ? 'block' : 'none';
  renderResults(searchInput.value);
});
clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  clearBtn.style.display = 'none';
  renderResults('');
  searchInput.focus();
});

resultsList.addEventListener('click', (e) => {
  const tag = e.target.closest('.pallet-tag');
  if(tag){
    switchTab('pallets');
    openPallet(tag.dataset.pallet);
  }
});

palletGrid.addEventListener('click', (e) => {
  const chip = e.target.closest('.pallet-chip');
  if(chip) openPallet(chip.dataset.pallet);
});

// init
renderResults('');
renderPalletGrid();
</script>
</body>
</html>
